<style>

<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <a href="#" class="logo" onclick="resetSearch()">e</a>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search or type 'most liked:projects'...">
            <button class="search-btn" onclick="executeSearch()">🔍</button>
        </div>
    </div>

    <!-- Main View Panel -->
    <div class="container">
        <div class="header-section">
            <h2 id="resultTitle">Trending Projects</h2>
            <div class="operator-tip">
                Tip: Try typing <span class="operator-link" onclick="fillMagicQuery()">most liked:projects</span> to trigger the special filter.
            </div>
        </div>

        <!-- Render Target Grid -->
        <div class="grid" id="projectGrid"></div>
    </div>

    <script>
        // Project Database
        const projectDatabase = [
            { id: 1, title: "Paper Minecraft v11.4", author: "Griffpatch", likes: 843200, views: 2400500, color: "#4c97ff" },
            { id: 2, title: "Geometric Dash World", author: "CrystalCoder", likes: 320100, views: 980000, color: "#ffab19" },
            { id: 3, title: "3D Scrolling Engine", author: "MathWizard", likes: 512000, views: 1200000, color: "#2ca02c" },
            { id: 4, title: "Anime Dress Up Deluxe", author: "KawaiiNeko", likes: 94000, views: 450000, color: "#e377c2" },
            { id: 5, title: "Epic Platformer v2", author: "UnicornGamer", likes: 721000, views: 1900000, color: "#bcbd22" },
            { id: 6, title: "Flight Simulator Pro", author: "AeroTech", likes: 15000, views: 82000, color: "#17becf" },
            { id: 7, title: "Clicker Tycoon 2026", author: "GoldMiner", likes: 935000, views: 3100000, color: "#9467bd" },
            { id: 8, title: "OS Emulator System", author: "TechGuy", likes: 43000, views: 150000, color: "#7f7f7f" }
        ];

        // Format system values safely (e.g., 843200 -> 843.2K)
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num;
        }

        // Render project cards to interface
        function renderProjects(projects) {
            const grid = document.getElementById('projectGrid');
            grid.innerHTML = '';

            if (projects.length === 0) {
                grid.innerHTML = `<div class="no-results">No projects matched your search criteria.</div>`;
                return;
            }

            projects.forEach(project => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="thumbnail" style="background-color: ${project.color}">
                        E
                    </div>
                    <div class="card-info">
                        <div class="project-title" title="${project.title}">${project.title}</div>
                        <div class="project-author">by ${project.author}</div>
                        <div class="stats">
                            <div class="stat-item" title="Likes">❤️ ${formatNumber(project.likes)}</div>
                            <div class="stat-item" title="Views">👁️ ${formatNumber(project.views)}</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Core logic to parse and filter input strings
        function executeSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const titleElement = document.getElementById('resultTitle');
            
            let filteredResults = [...projectDatabase];

            // Specific syntax parsing check
            if (query === 'most liked:projects') {
                titleElement.innerText = "Search Results: Most Liked Projects";
                // Sort descending by like counts
                filteredResults.sort((a, b) => b.likes - a.likes);
            } else if (query !== '') {
                titleElement.innerText = `Search Results for "${query}"`;
                // Standard text match fallback
                filteredResults = filteredResults.filter(p => 
                    p.title.toLowerCase().includes(query.toLowerCase()) || 
                    p.author.toLowerCase().includes(query.toLowerCase())
                );
            } else {
                titleElement.innerText = "Trending Projects";
            }

            renderProjects(filteredResults);
        }

        // Helper interface utilities
        function fillMagicQuery() {
            document.getElementById('searchInput').value = 'most liked:projects';
            executeSearch();
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            executeSearch();
        }

        // Initial default view generation
        renderProjects(projectDatabase);
    </script>
</body>
